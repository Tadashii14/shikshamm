<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Attendance System</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="login-container">
      <h1 id="pageTitle">Login to Attendance System</h1>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email or Username:</label>
          <input type="text" id="email" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn">Login</button>
      </form>
    </div>

    <script>
      // Demo login: no backend, no Firebase. Any credentials are approved
      // and the user is routed to their portal based on where they came from.

      const params = new URLSearchParams(location.search);
      const directTarget = params.get('target');
      const storedTarget = localStorage.getItem('landing_target');
      const target = (directTarget || storedTarget || 'student').toLowerCase();

      // Show the right title based on the intended portal
      if (target === 'student') {
        document.getElementById('pageTitle').textContent = 'Student Login';
      } else if (target === 'teacher' || target === 'admin') {
        document.getElementById('pageTitle').textContent = 'Teacher/Admin Login';
      }

      document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim() || '';
        const isTeacher = (target === 'teacher' || target === 'admin');

        // Store role + identity for the dashboards (client-side only)
        localStorage.setItem('role', isTeacher ? 'teacher' : 'student');
        localStorage.setItem('userEmail', email);
        localStorage.setItem('ADMIN_KEY', 'super-secret-key');

        // Route to the correct portal
        window.location.href = isTeacher ? '/admin' : '/student';
      });
    </script>
  </body>
</html>
